appId: com.skykeys.app
productName: SkyKeys
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
# No custom icon yet (resources/icon.ico) — electron-builder falls back to its
# default icon until one is added; point `win.icon` at it once it exists.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}
