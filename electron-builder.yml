appId: com.skykeys.app
productName: SkyKeys
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
# Both native deps (get-windows, and nut.js's libnut-win32) are N-API modules,
# which are ABI-stable across Node/Electron and already ship a resolved
# win32-x64 prebuilt binary from `npm install` — no Electron-specific rebuild
# is needed. Also works around an environment-specific node-gyp bug
# (https://github.com/nodejs/node-gyp/issues/65) triggered by this repo's
# path containing a space, which otherwise hangs electron-builder's default
# native rebuild step.
npmRebuild: false
win:
  # Resolved relative to directories.buildResources (resources/icon.ico).
  icon: icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}
